name: Deploy — Azure

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

# ─────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_CLIENT_ID          — service principal client ID (OIDC)
#   AZURE_TENANT_ID          — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    — Azure subscription ID
#   AZURE_REGISTRY           — ACR login server (e.g. aerobaseregistry.azurecr.io)
#   AZURE_STATIC_WEB_APP_TOKEN — from az staticwebapp secrets list
#   MONGO_URI, JWT_SECRET    — passed to Container App at deploy time
#   (CLOUDINARY_*, SENDGRID_* if used)
#
# Required GitHub Variables (Settings → Variables → Actions):
#   AZURE_RESOURCE_GROUP     — e.g. aerobase-rg
#   AZURE_CONTAINER_APP      — e.g. aerobase-backend
#   AZURE_BACKEND_URL        — https://<fqdn> of the Container App
#   AZURE_FRONTEND_URL       — https://<name>.azurestaticapps.net
# ─────────────────────────────────────────────────────────

permissions:
  id-token: write   # required for OIDC login
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  # ── Gate ─────────────────────────────────────
  check-ci:
    name: Check CI Result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      short_sha: ${{ steps.s.outputs.short }}
    steps:
      - id: s
        run: echo "short=${SHA::7}" >> $GITHUB_OUTPUT
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}

  # ── Build & push Docker image → ACR ──────────
  push-image:
    name: Build & Push → ACR
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.AZURE_BACKEND_URL }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.AZURE_REGISTRY }}

      - name: Build & push backend image
        id: meta
        env:
          IMAGE: ${{ secrets.AZURE_REGISTRY }}/backend:${{ needs.check-ci.outputs.sha }}
        run: |
          docker build -t $IMAGE ./MER/Backend
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ── Deploy backend → Azure Container Apps ────
  deploy-backend:
    name: Deploy Backend → Container Apps
    needs: [check-ci, push-image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.AZURE_BACKEND_URL }}
    steps:
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.AZURE_REGISTRY }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ needs.push-image.outputs.image }}
          environmentVariables: >
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=5001
            FRONTEND_URL=${{ vars.AZURE_FRONTEND_URL }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}

      - name: Health check
        run: |
          echo "Waiting for Container App to boot…"
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.AZURE_BACKEND_URL }}/api/ping" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "✅ Health check passed"; exit 0; fi
            echo "Attempt $i — HTTP $STATUS, retrying in 10s…"
            sleep 10
          done
          echo "❌ Health check failed after 150s"; exit 1

  # ── Deploy frontend → Azure Static Web Apps ──
  deploy-frontend:
    name: Deploy Frontend → Static Web Apps
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.AZURE_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Download dist artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ needs.check-ci.outputs.sha }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APP_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true

  # ── Summary ───────────────────────────────────
  summary:
    name: Deploy Summary
    needs: [check-ci, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          B="${{ needs.deploy-backend.result }}"
          F="${{ needs.deploy-frontend.result }}"
          BI=$([[ "$B" == "success" ]] && echo "✅" || echo "❌")
          FI=$([[ "$F" == "success" ]] && echo "✅" || echo "❌")
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ☁️ Azure Deploy — \`${{ needs.check-ci.outputs.short_sha }}\`

          | Service  | Result      | URL |
          |----------|-------------|-----|
          | Backend  | $BI $B  | ${{ vars.AZURE_BACKEND_URL }} |
          | Frontend | $FI $F | ${{ vars.AZURE_FRONTEND_URL }} |
          EOF
