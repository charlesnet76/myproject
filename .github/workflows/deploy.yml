name: Deploy — Production

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

# Only one production deploy at a time — never cancel in-progress
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Gate ───────────────────────────────────
  check-ci:
    name: Check CI Result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      short_sha: ${{ steps.short.outputs.sha }}
    steps:
      - name: Set short SHA
        id: short
        run: echo "sha=${SHA::7}" >> $GITHUB_OUTPUT
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}

  # ── Deploy backend → Railway ───────────────
  deploy-backend:
    name: Deploy Backend → Railway
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production           # ← must match environment name in GitHub Settings
      url: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        working-directory: MER/Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check (waits up to 60s for Railway to boot)
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.BACKEND_URL }}/api/ping)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed ✅"; exit 0
            fi
            echo "Attempt $i — status $STATUS, retrying in 5s…"
            sleep 5
          done
          echo "Health check failed ❌"; exit 1

  # ── Deploy frontend → Vercel ───────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production           # ← same environment — both jobs require approval
      url: ${{ vars.FRONTEND_URL }}
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Download dist artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ needs.check-ci.outputs.sha }}
          path: MER/Fromend/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: MER/Fromend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt dist to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
        working-directory: MER/Fromend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Summary ────────────────────────────────
  summary:
    name: Deploy Summary
    needs: [check-ci, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"
          B_ICON=$([[ "$BACKEND"  == "success" ]] && echo "✅" || echo "❌")
          F_ICON=$([[ "$FRONTEND" == "success" ]] && echo "✅" || echo "❌")

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Production Deploy — \`${{ needs.check-ci.outputs.short_sha }}\`

          | Service  | Result   | URL |
          |----------|----------|-----|
          | Backend  | $B_ICON $BACKEND  | ${{ vars.BACKEND_URL }} |
          | Frontend | $F_ICON $FRONTEND | ${{ vars.FRONTEND_URL }} |
          EOF
