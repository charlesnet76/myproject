name: Deploy — Production

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

# Only one production deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Gate: only run if CI passed ────────────
  check-ci:
    name: Check CI Result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: CI passed — proceeding with deploy
        run: echo "SHA=${{ github.event.workflow_run.head_sha }}"

  # ── Deploy backend → Railway ───────────────
  deploy-backend:
    name: Deploy Backend → Railway
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-backend.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        working-directory: MER/Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 5 \
            https://your-backend.railway.app/api/ping

  # ── Deploy frontend → Vercel ───────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-frontend.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      # Download the dist built by CI (avoids rebuilding)
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ needs.check-ci.outputs.sha }}
          path: MER/Fromend/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: MER/Fromend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt dist to Vercel
        id: vercel-deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: MER/Fromend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Summary ────────────────────────────────
  summary:
    name: Deploy Summary
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ${{ needs.deploy-backend.result == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit   | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
