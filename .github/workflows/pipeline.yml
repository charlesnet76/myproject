name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# ─────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets):
#   RAILWAY_TOKEN      — Railway dashboard → Account Settings → Tokens
#   VERCEL_TOKEN       — Vercel dashboard  → Settings → Tokens
#   VERCEL_ORG_ID      — run `vercel link` locally, check .vercel/project.json
#   VERCEL_PROJECT_ID  — same file as above
# ─────────────────────────────────────────────

jobs:
  # ── 1. Backend CI ──────────────────────────
  backend-ci:
    name: Backend — Install & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MER/Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MER/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

  # ── 2. Frontend CI ─────────────────────────
  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MER/Fromend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MER/Fromend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: MER/Fromend/dist
          retention-days: 1

  # ── 3. Docker build check ──────────────────
  docker-ci:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

  # ── 4. Deploy backend → Railway ────────────
  deploy-backend:
    name: Deploy Backend → Railway
    needs: [backend-ci, docker-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    defaults:
      run:
        working-directory: MER/Backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── 5. Deploy frontend → Vercel ────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    defaults:
      run:
        working-directory: MER/Fromend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MER/Fromend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
